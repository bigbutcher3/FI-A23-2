<div class="container">
    <div class="card mt-3">
        <div class="card-body">
            <div class="row mt-3">
                <div class="col-12">
                    <h3 class="card-title">Ausgabe der einzelnen Datensätze</h3>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-12">
                    <ul class="list-group">
                        {foreach $smarty.const.NAMEARRAY as $item=>$value}
                        <li class="list-group-item d-flex"><span class="col-3 bg-color">
                            {$value}:</span><span class="col-1"></span>
                            <span class="col-8">{$smarty.session.datensatz.{$item}}</span>
                        </li>
                        {/foreach}
                    </ul>
                    <br>
                    <p>Datensätze: {$smarty.session.index+1} von {$smarty.session.count+1}</p>
                    <a href="/Textspeichernjson" role="button"
                       class="btn btn-custom mt-3">zum Formular</a>
                    <a href="/Textspeichernjson/anfangDatensatz" role="button"
                       class="btn btn-custom mt-3 {if $smarty.session.index === 0} disabled {/if}"><<</a>
                    <a href="/Textspeichernjson/back" role="button"
                       class="btn btn-custom mt-3 {if $smarty.session.index === 0} disabled {/if}">Back</a>
                    <a href="/Textspeichernjson/next" role="button"
                       class="btn btn-custom mt-3 {if $smarty.session.index === $smarty.session.count} disabled {/if}">Next</a>
                    <a href="/Textspeichernjson/endeDatensatz" role="button"
                       class="btn btn-custom mt-3 {if $smarty.session.index === $smarty.session.count} disabled {/if}">>></a>
                    <a href="/Textspeichernjson/del" role="button"
                       class="btn btn-custom mt-3">Löschen</a>
                    <a href="/Textspeichernjson/destroy" role="button"
                       class="btn btn-custom mt-3">Abmelden</a>
                </div>
            </div>
        </div>
    </div>
</div>
